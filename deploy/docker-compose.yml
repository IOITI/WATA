x-common:
  rabbitmq-password: &rabbitmq_password pykvys-9nixqo-cuqvYt

services:
  traefik:
    image: traefik:v3.7.7
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api=true" 
      - "--ping=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Set up HTTP (port 80) and HTTPS (port 443) entrypoints. These are the ports inside
      # the container: the server's own are HTTP_PORT and HTTPS_PORT in .env (see ports below).
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Second HTTPS port, for the admin interface when it has no domain of its own
      # (ADMIN_ENTRYPOINT=adminsecure in .env). Nothing else is routed on it.
      - "--entrypoints.adminsecure.address=:8443"
      # Global HTTP to HTTPS redirection, to the port HTTPS is published on: the name of
      # the entrypoint would send browsers to 443 whatever HTTPS_PORT says.
      - "--entrypoints.web.http.redirections.entryPoint.to=:${HTTPS_PORT:-443}"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt configuration
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      # 80 and 443 unless HTTP_PORT or HTTPS_PORT in .env say otherwise (a port number).
      # TradingView sends webhooks to 80 and 443 only, and Let's Encrypt checks the domain
      # on 80: another port needs something in front that forwards those to it.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # Only on this machine unless ADMIN_PORT says otherwise (ADMIN_PORT=0.0.0.0:8443 in .env).
      - "${ADMIN_PORT:-127.0.0.1:8443}:8443"
    expose:
      - '80'
      - '443'
    networks:
      - trade-net
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "../../var/lib/traefik/letsencrypt:/letsencrypt"
    healthcheck:
      # Traefik has a native CLI command for health checks
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s       # Check every 10 seconds
      timeout: 3s         # Consider it failed if no response in 3 seconds
      retries: 3          # Fail after 3 consecutive failures
      start_period: 5s    # Give Traefik 5 seconds to boot up before checking
  postgres1:
    image: postgres:16-alpine
    hostname: postgres1
    container_name: 'postgres'
    # When the server runs out of memory the kernel kills the highest score first: the trading path
    # last, the admin (backtests, Claude's studies) and the backups first.
    oom_score_adj: -500
    # Memory for the price tables that backtests and the Data pages read a day at a time: a third of
    # the container for PostgreSQL's own buffers, the planner told of the file cache beside them, and
    # more for each sort or hash of a query before it spills to disk.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
    # Parallel queries share memory through /dev/shm, 64 MB in a container unless it is said.
    shm_size: 256m
    environment:
      - POSTGRES_USER=wata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wata_secret_change_me}
      - POSTGRES_DB=wata
    volumes:
      - ../../var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      - trade-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wata"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1536M

  # The database's dumps (deploy/pg_backup.sh): each night at 02:17 UTC without the bars' rows,
  # whole on Sundays, into var/lib/backups, which lab/sync.sh pulls to the Mac. Reaches only the
  # database; nothing reaches it.
  pg_backup1:
    image: postgres:16-alpine
    hostname: pg_backup1
    container_name: 'pg_backup1'
    oom_score_adj: 300
    entrypoint: ["sh", "/pg_backup.sh"]
    environment:
      - PGHOST=postgres1
      - PGUSER=wata
      - PGPASSWORD=${POSTGRES_PASSWORD:-wata_secret_change_me}
      - PGDATABASE=wata
    volumes:
      - ./pg_backup.sh:/pg_backup.sh:ro
      - ../../var/lib/backups:/backups
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres1:
        condition: service_healthy

  rabbitmq1:
    image: rabbitmq:3-management
    hostname: rabbitmq1
    container_name: 'rabbitmq'
    oom_score_adj: -500
    environment:
      - RABBITMQ_DEFAULT_USER=trade-app
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-pykvys-9nixqo-cuqvYt}
    volumes:
        - ../../var/lib/rabbitmq:/var/lib/rabbitmq/
        - ../../var/log/rabbitmq:/var/log/rabbitmq
        - ../../etc/rabbitmq/01-conf-custom.conf:/etc/rabbitmq/conf.d/01-conf-custom.conf
    networks:
      - trade-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M

  web_server1:
    image: wata-base:latest
    # tini as PID 1 hands Docker's stop (SIGTERM) to the service, started with exec by
    # src/start_python_script.sh, which then stops cleanly. So on every WATA service below.
    init: true
    hostname: web_server1
    container_name: 'web_server1'
    oom_score_adj: -500
    environment:
      - WATA_APP_ROLE=web_server
    volumes:
        - ../../var/log:/app/var/log/
        - ../../var/lib:/app/var/lib/
        - ../../etc/config.json:/app/etc/config.json
        # Its own key, read-only, and every service's public key: the credentials sealed for it in
        # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
        - ../../keys/web_server:/app/keys/own:ro
        - ../../keys/public:/app/keys/public:ro
    labels:
      - "traefik.enable=true"
      # Define the domain name for the application
      - "traefik.http.routers.fastapi.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.fastapi.entrypoints=websecure"
      # Tell Traefik to secure this route using Let's Encrypt
      - "traefik.http.routers.fastapi.tls.certresolver=myresolver"
      # Tell Traefik which port the container is listening on internally
      - "traefik.http.services.fastapi.loadbalancer.server.port=80"
      # Define the middleware and list allowed IPs (add /32 to the end of single IPs)
      # https://www.tradingview.com/support/solutions/43000529348-about-webhooks/
      # IP addresses of TradingView webhook servers
      - "traefik.http.middlewares.api-ip-whitelist.ipallowlist.sourcerange=127.0.0.1/32, 83.195.218.196/32, 52.89.214.238/32, 34.212.75.30/32, 54.218.53.128/32, 52.32.178.7/32"
      # Apply the middleware to FastAPI router
      - "traefik.http.routers.fastapi.middlewares=api-ip-whitelist"
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      traefik:
        condition: service_healthy
  telegram1:
    image: wata-base:latest
    init: true
    hostname: telegram1
    container_name: 'telegram1'
    oom_score_adj: -500
    environment:
      - WATA_APP_ROLE=telegram
    volumes:
      - ../../var/log:/app/var/log/
      - ../../etc/config.json:/app/etc/config.json
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/telegram:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      # Its credentials are read from PostgreSQL at its start.
      postgres1:
        condition: service_healthy

  scheduler1:
    image: wata-base:latest
    init: true
    hostname: scheduler1
    container_name: 'scheduler1'
    oom_score_adj: -500
    environment:
      - WATA_APP_ROLE=scheduler
    volumes:
      - ../../var/log:/app/var/log/
      - ../../var/lib:/app/var/lib/
      - ../../etc/config.json:/app/etc/config.json
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/scheduler:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      # Its credentials are read from PostgreSQL at its start.
      postgres1:
        condition: service_healthy

  trader1:
    image: wata-base:latest
    init: true
    # A signal in hand is finished before the trader stops: a sale, a buy, the position looked
    # up (up to 11 s), each request to Saxo allowed 30 s.
    stop_grace_period: 60s
    hostname: trader1
    container_name: 'trader1'
    oom_score_adj: -500
    environment:
      - WATA_APP_ROLE=trader
      # Where Saxo sends the browser back with a login's code: registered in the app (src/saxo_authen/endpoints.py).
      - SAXO_REDIRECT_URL=${SAXO_REDIRECT_URL:-}
    volumes:
      - ../../var/log:/app/var/log/
      - ../../var/lib:/app/var/lib/
      - ../../etc/config.json:/app/etc/config.json
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/trader:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy

  position_monitor1:
    image: wata-base:latest
    init: true
    # A sale sent to Saxo is waited for (15 s at most), then the closures being recorded.
    stop_grace_period: 45s
    hostname: position_monitor1
    container_name: 'position_monitor1'
    oom_score_adj: -500
    environment:
      - WATA_APP_ROLE=position_monitor
      # Where Saxo sends the browser back with a login's code: registered in the app (src/saxo_authen/endpoints.py).
      - SAXO_REDIRECT_URL=${SAXO_REDIRECT_URL:-}
      - WATA_HEARTBEAT_URL=${WATA_HEARTBEAT_URL:-}
    volumes:
      - ../../var/log:/app/var/log/
      - ../../var/lib:/app/var/lib/
      - ../../etc/config.json:/app/etc/config.json
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/position_monitor:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy

  watchlist_manager1:
    image: wata-base:latest
    init: true
    hostname: watchlist_manager1
    container_name: 'watchlist_manager1'
    environment:
      - WATA_APP_ROLE=watchlist_manager
      # Where Saxo sends the browser back with a login's code: registered in the app (src/saxo_authen/endpoints.py).
      - SAXO_REDIRECT_URL=${SAXO_REDIRECT_URL:-}
    expose:
      - '8081'
    volumes:
      - ../../var/log:/app/var/log/
      - ../../var/lib:/app/var/lib/
      - ../../etc/config.json:/app/etc/config.json
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/watchlist_manager:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      # Its Saxo app is read from PostgreSQL at its start.
      postgres1:
        condition: service_healthy

  # Administrative web interface. Not started unless the "admin" profile is
  # enabled (COMPOSE_PROFILES=admin in .env, with ADMIN_DOMAIN and ADMIN_ALLOWED_IPS,
  # and ADMIN_ENTRYPOINT and ADMIN_PORT when it has no domain of its own).
  admin1:
    image: wata-base:latest
    init: true
    hostname: admin1
    container_name: 'admin1'
    oom_score_adj: 500
    profiles: ["admin"]
    environment:
      - WATA_APP_ROLE=admin
      # Where Saxo sends the browser back with a login's code: registered in the app (src/saxo_authen/endpoints.py).
      - SAXO_REDIRECT_URL=${SAXO_REDIRECT_URL:-}
      # The address of TradingView's webhook, shown on request with its token (Credentials).
      - WATA_API_DOMAIN=${API_DOMAIN:-}
    expose:
      - '8082'
    volumes:
      # The logs of the other services are only read. Its own directory (log and
      # audit trail) is the one place under var/log it writes to.
      - ../../var/log:/app/var/log/:ro
      - ../../var/log/wata-admin:/app/var/log/wata-admin
      # Only what the admin needs from var/lib (which also holds the PostgreSQL data files): the web
      # server's token file of before, its own password hash. Saxo's login is read from PostgreSQL.
      - ../../var/lib/web_server:/app/var/lib/web_server
      - ../../var/lib/admin:/app/var/lib/admin
      # Backtests asked for from the interface: the prices they run on, and their results.
      - ../../var/lib/price_history:/app/var/lib/price_history
      - ../../var/lib/backtests:/app/var/lib/backtests
      # The database's dumps, only read: health says the last one (pg_backup1).
      - ../../var/lib/backups:/app/var/lib/backups:ro
      # The directory rather than the file: the config editor replaces config.json atomically.
      # The RabbitMQ configuration kept beside it is not the admin's to change.
      - ../../etc:/app/etc
      - ../../etc/rabbitmq:/app/etc/rabbitmq:ro
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/admin:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_DOMAIN:-admin.invalid}`)"
      # On its own domain, the usual HTTPS port. Without one, ADMIN_DOMAIN is the API
      # domain and ADMIN_ENTRYPOINT=adminsecure serves it on the second HTTPS port.
      - "traefik.http.routers.admin.entrypoints=${ADMIN_ENTRYPOINT:-websecure}"
      # The lowest priority: given the API domain without the second port, the admin
      # is unreachable and the webhook keeps its route.
      - "traefik.http.routers.admin.priority=1"
      - "traefik.http.routers.admin.tls.certresolver=myresolver"
      - "traefik.http.services.admin.loadbalancer.server.port=8082"
      # Your own addresses only (add /32 to the end of single IPs). Nothing is allowed by default.
      - "traefik.http.middlewares.admin-ip-allowlist.ipallowlist.sourcerange=${ADMIN_ALLOWED_IPS:-127.0.0.1/32}"
      - "traefik.http.middlewares.admin-headers.headers.stsSeconds=31536000"
      - "traefik.http.routers.admin.middlewares=admin-ip-allowlist,admin-headers"
      # The admin is on two networks: Traefik reaches it on trade-net, never on control-net.
      - "traefik.docker.network=${COMPOSE_PROJECT_NAME:-deploy}_trade-net"
    networks:
      - trade-net
      - control-net
    # The token it opens the control service with (service_control1).
    secrets:
      - service_control_token
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          # Backtests run in this container, one at a time and at the lowest priority: the
          # admin, the backtest's command with a day of recorded turbos, and the Pine runner;
          # and, with the MCP endpoint on, one of Claude's Pine studies beside them (a heap of
          # admin.mcp.study_memory_mb). Sized for a server of 8 GB.
          memory: 3072M
          # One processor at most: the rest stays with the services that trade.
          cpus: '1.0'
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      traefik:
        condition: service_healthy

  # The control service: the one container that holds Docker's socket, so that the admin can
  # restart WATA's own services (src/service_control/containers.py) without holding it. Mounted
  # read-only or not, the socket answers anything: its code makes two calls, nothing else. Only
  # the admin reaches it (control-net, internal), with the token both are given.
  service_control1:
    image: wata-base:latest
    init: true
    hostname: service_control1
    container_name: 'service_control1'
    profiles: ["admin"]
    environment:
      - WATA_APP_ROLE=service_control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../var/log/wata-service-control:/app/var/log/wata-service-control
    secrets:
      - service_control_token
    networks:
      - control-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 128M

  # Price recorder: ten-second bars of the turbos and their index, kept for
  # backtesting. Not started unless the "recorder" profile is enabled
  # (COMPOSE_PROFILES=recorder in .env, or admin,recorder for both) and
  # trade.config.price_recorder.enabled is true. No trading service uses it.
  price_recorder1:
    image: wata-base:latest
    init: true
    hostname: price_recorder1
    container_name: 'price_recorder1'
    profiles: ["recorder"]
    environment:
      - WATA_APP_ROLE=price_recorder
      # Where Saxo sends the browser back with a login's code: registered in the app (src/saxo_authen/endpoints.py).
      - SAXO_REDIRECT_URL=${SAXO_REDIRECT_URL:-}
    volumes:
      # Only what it needs: its own log, the Saxo token it shares with the other
      # services, and the directory its exports are written to.
      - ../../var/log/wata-price-recorder:/app/var/log/wata-price-recorder
      - ../../var/lib/saxo_auth:/app/var/lib/saxo_auth
      - ../../var/lib/price_export:/app/var/lib/price_export
      - ../../etc/config.json:/app/etc/config.json:ro
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/price_recorder:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 256M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy

  # Capital.com feed: the Nasdaq 100 streamed from Capital.com, recorded every
  # ten seconds, sent live to the admin's charts and kept as one file a day for
  # backtests. Not started unless the "capital" profile is enabled
  # (COMPOSE_PROFILES=capital in .env, or admin,capital with the admin) and
  # trade.config.capital_feed.enabled is true. Its login is the three CAPITAL_*
  # lines of .env, handed to this container alone: Capital.com has no key that
  # can only read prices. No trading service uses it.
  capital_feed1:
    image: wata-base:latest
    init: true
    hostname: capital_feed1
    container_name: 'capital_feed1'
    profiles: ["capital"]
    environment:
      - WATA_APP_ROLE=capital_feed
      - CAPITAL_API_KEY=${CAPITAL_API_KEY:-}
      - CAPITAL_IDENTIFIER=${CAPITAL_IDENTIFIER:-}
      - CAPITAL_PASSWORD=${CAPITAL_PASSWORD:-}
    volumes:
      # Only what it needs: its own log, the folder of its day files, and the
      # configuration, read only.
      - ../../var/log/wata-capital-feed:/app/var/log/wata-capital-feed
      - ../../var/lib/price_history/capital:/app/var/lib/price_history/capital
      - ../../etc/config.json:/app/etc/config.json:ro
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/capital_feed:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 256M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy

  # TA engine: WATA's own signals, from the Pine scripts of the admin's signal
  # rules run on the bars the Capital.com feed records. Not started unless the
  # "ta" profile is enabled (COMPOSE_PROFILES=admin,capital,ta in .env) and
  # trade.config.ta_engine.enabled is true. A rule only journals its signals
  # until it is switched to live in the admin. No trading service waits for it,
  # and like them it keeps every processor: a rule runs its script on each bar.
  ta_engine1:
    image: wata-base:latest
    init: true
    hostname: ta_engine1
    container_name: 'ta_engine1'
    profiles: ["ta"]
    environment:
      - WATA_APP_ROLE=ta_engine
    volumes:
      # Only what it needs, and only its log written: the rules and scripts the
      # admin keeps, the web server's token to send signals with, and the
      # configuration. The admin's credentials stay out of reach.
      - ../../var/log/wata-ta-engine:/app/var/log/wata-ta-engine
      - ../../var/lib/admin/ta:/app/var/lib/ta:ro
      - ../../var/lib/web_server:/app/var/lib/web_server:ro
      - ../../etc/config.json:/app/etc/config.json:ro
      # Its own key, read-only, and every service's public key: the credentials sealed for it in
      # PostgreSQL open with the first; what it writes is sealed with the others (src/vault/).
      - ../../keys/ta_engine:/app/keys/own:ro
      - ../../keys/public:/app/keys/public:ro
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          # The Pine runners' heaps (trade.config.ta_engine.runner_memory_mb for the live
          # rules, shadow_runner_memory_mb for the shadow ones) and the engine. The shadow
          # runner is the first process stopped when it runs short. A runner holds more
          # than its heap: PineTS's compiles keep native memory (729 MB for a shadow
          # runner of 256 MB of heap on 2026-10-22, 768 MB of the 1024M then).
          memory: 2560M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy

  # The credentials moved into PostgreSQL once, at the deploy of v0.43.0, and their old places cleared
  # later at the operator's word (src/vault/migrate.py). Never started by up:
  #   docker compose --profile tools run --rm vault_tools migrate --dry-run
  vault_tools:
    image: wata-base:latest
    profiles: ["tools"]
    environment:
      - WATA_ENV_FILE=/app/wata.env
    volumes:
      - ../../etc:/app/etc
      - ../../var/lib/web_server:/app/var/lib/web_server
      - ../../var/lib/admin:/app/var/lib/admin
      # Saxo's token file, moved in under the services' lock and renamed .imported.
      - ../../var/lib/saxo_auth:/app/var/lib/saxo_auth
      - ../../keys/public:/app/keys/public:ro
      # Read as lines of NAME=value, never run.
      - ../../.env:/app/wata.env:ro
    networks:
      - trade-net
    # Run with every service stopped (a deploy): it starts the database it writes to.
    depends_on:
      postgres1:
        condition: service_healthy
    entrypoint: ["python", "-m", "src.vault"]
    command: ["migrate", "--dry-run"]

networks:
  trade-net:
  # Between the admin and the control service alone: no route out, no other container on it.
  control-net:
    internal: true

secrets:
  # Made by install_package.sh at the first install, never overwritten.
  service_control_token:
    file: ../../var/lib/service_control/token
