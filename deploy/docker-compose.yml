x-common:
  rabbitmq-password: &rabbitmq_password pykvys-9nixqo-cuqvYt

services:
  traefik:
    image: traefik:v3.7.7
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api=true" 
      - "--ping=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      # Set up HTTP (port 80) and HTTPS (port 443) entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global HTTP to HTTPS redirection
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      # Let's Encrypt configuration
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    expose:
      - '80'
      - '443'
    networks:
      - trade-net
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "../../var/lib/traefik/letsencrypt:/letsencrypt"
    healthcheck:
      # Traefik has a native CLI command for health checks
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s       # Check every 10 seconds
      timeout: 3s         # Consider it failed if no response in 3 seconds
      retries: 3          # Fail after 3 consecutive failures
      start_period: 5s    # Give Traefik 5 seconds to boot up before checking
  postgres1:
    image: postgres:16-alpine
    hostname: postgres1
    container_name: 'postgres'
    environment:
      - POSTGRES_USER=wata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wata_secret_change_me}
      - POSTGRES_DB=wata
    volumes:
      - ../../var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      - trade-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wata"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 512M

  rabbitmq1:
    image: rabbitmq:3-management
    hostname: rabbitmq1
    container_name: 'rabbitmq'
    environment:
      - RABBITMQ_DEFAULT_USER=trade-app
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-pykvys-9nixqo-cuqvYt}
    volumes:
        - ../../var/lib/rabbitmq:/var/lib/rabbitmq/
        - ../../var/log/rabbitmq:/var/log/rabbitmq
        - ../../etc/rabbitmq/01-conf-custom.conf:/etc/rabbitmq/conf.d/01-conf-custom.conf
    networks:
      - trade-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M

  web_server1:
    image: wata-base:latest
    hostname: web_server1
    container_name: 'web_server1'
    environment:
      - WATA_APP_ROLE=web_server
    volumes:
        - ../../var/log:/app/var/log/
        - ../../var/lib:/app/var/lib/
        - ../../etc/config.json:/app/etc/config.json
    labels:
      - "traefik.enable=true"
      # Define the domain name for the application
      - "traefik.http.routers.fastapi.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.fastapi.entrypoints=websecure"
      # Tell Traefik to secure this route using Let's Encrypt
      - "traefik.http.routers.fastapi.tls.certresolver=myresolver"
      # Tell Traefik which port the container is listening on internally
      - "traefik.http.services.fastapi.loadbalancer.server.port=80"
      # Define the middleware and list allowed IPs (add /32 to the end of single IPs)
      # https://www.tradingview.com/support/solutions/43000529348-about-webhooks/
      # IP addresses of TradingView webhook servers
      - "traefik.http.middlewares.api-ip-whitelist.ipallowlist.sourcerange=127.0.0.1/32, 83.195.218.196/32, 52.89.214.238/32, 34.212.75.30/32, 54.218.53.128/32, 52.32.178.7/32"
      # Apply the middleware to FastAPI router
      - "traefik.http.routers.fastapi.middlewares=api-ip-whitelist"
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy
      traefik:
        condition: service_healthy
  telegram1:
    image: wata-base:latest
    hostname: telegram1
    container_name: 'telegram1'
    environment:
      - WATA_APP_ROLE=telegram
    volumes:
      - ../../var/log:/app/var/log/
      - ../../etc/config.json:/app/etc/config.json
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      rabbitmq1:
        condition: service_healthy

  scheduler1:
    image: wata-base:latest
    hostname: scheduler1
    container_name: 'scheduler1'
    environment:
      - WATA_APP_ROLE=scheduler
    volumes:
      - ../../var/log:/app/var/log/
      - ../../etc/config.json:/app/etc/config.json
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      rabbitmq1:
        condition: service_healthy

  trader1:
    image: wata-base:latest
    hostname: trader1
    container_name: 'trader1'
    environment:
      - WATA_APP_ROLE=trader
    volumes:
      - ../../var/log:/app/var/log/
      - ../../var/lib:/app/var/lib/
      - ../../etc/config.json:/app/etc/config.json
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy

  position_monitor1:
    image: wata-base:latest
    hostname: position_monitor1
    container_name: 'position_monitor1'
    environment:
      - WATA_APP_ROLE=position_monitor
    volumes:
      - ../../var/log:/app/var/log/
      - ../../var/lib:/app/var/lib/
      - ../../etc/config.json:/app/etc/config.json
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M
    depends_on:
      rabbitmq1:
        condition: service_healthy
      postgres1:
        condition: service_healthy

  watchlist_manager1:
    image: wata-base:latest
    hostname: watchlist_manager1
    container_name: 'watchlist_manager1'
    environment:
      - WATA_APP_ROLE=watchlist_manager
    expose:
      - '8081'
    volumes:
      - ../../var/log:/app/var/log/
      - ../../var/lib:/app/var/lib/
      - ../../etc/config.json:/app/etc/config.json
    networks:
      - trade-net
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 1024M

networks:
  trade-net:
