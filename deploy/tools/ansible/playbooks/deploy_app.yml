---
# A release installed beside the one that runs, then applied container by container (src/release/):
# nothing stops for the install, and each container is recreated only if the release changes what it runs
# and its guards allow (no position open and the market closed for the trading path and the recorders,
# no backtest or agent request for the admin...). What is held back waits for `watadeploy apply`, from the
# server or the admin's System page.
#
#   ./deploy_app_to_your_server.sh                     install, then apply what may go now
#   ./deploy_app_to_your_server.sh -e apply=none        install and say what would go: nothing recreated
#   ./deploy_app_to_your_server.sh -e services=admin1   install, then apply these containers alone
#   ./deploy_app_to_your_server.sh -e force=true        whatever holds them back (said in the history)
#   ./deploy_app_to_your_server.sh -e full=true         every container stopped and started again
- name: Deploy application to server
  hosts: wata_server
  become: yes
  vars:
    version: "{{ lookup('file', '../../../../VERSION') }}"  # Read the version from the local file
    package_name: "wata_app_v{{ version }}.zip"       # Define the package name with the version
    apply: now
    services: ""
    force: false
    full: false

  tasks:
    - name: Ensure the base directory exists with specific permissions
      ansible.builtin.file:
        path: /app/
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Ensure the wata directory exists with specific permissions
      ansible.builtin.file:
        path: /app/wata/
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Transfer the application package
      copy:
        src: "../../../../{{ package_name }}"  # Use the versioned package name
        dest: /tmp/{{ package_name }}

    - name: Unzip the application package
      unarchive:
        src: /tmp/{{ package_name }}
        dest: /app
        keep_newer: true
        extra_opts:
        - -o
        remote_src: yes

    - name: Set permissions
      file:
        path: /app/wata/
        state: directory
        mode: '0754'
        recurse: true

    # Builds the images beside the running ones, checks them, and names the release the newest: no
    # container is stopped. A release whose image fails its checks stops here, nothing changed.
    - name: Run the installation script
      command: /app/wata/{{ version }}/deploy/install_package.sh
      register: install_out

    - debug: var=install_out.stdout_lines

    - name: Remove the transferred package
      ansible.builtin.file:
        path: /tmp/{{ package_name }}
        state: absent

    - name: Say what the release changes, container by container
      command: /usr/local/bin/watadeploy plan
      register: plan_out
      changed_when: false

    - debug: var=plan_out.stdout_lines

    # Exit code 3: a container did not come back (put back on its image of before) or was not seen at work.
    - name: Apply what may go now
      command: >-
        /usr/local/bin/watadeploy apply --by playbook
        {{ '--services ' + services if services else '' }}
        {{ '--force' if (force | bool) else '' }}
      register: apply_out
      when:
        - apply == 'now'
        - not (full | bool)

    - debug: var=apply_out.stdout_lines
      when: apply_out is not skipped

    - name: Stop every container and start it again, on the newest release
      command: /usr/local/bin/watadeploy full {{ '--force' if (force | bool) else '' }}
      register: full_out
      when: full | bool

    - debug: var=full_out.stdout_lines
      when: full_out is not skipped
