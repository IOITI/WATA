name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Python the image is built with (Dockerfile), and the one it was built
        # with before: kept until 3.14 has run in production, so that going back
        # to 3.12 stays something that is tested.
        python-version: ['3.12', '3.14']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary=:all: -r requirements.txt

    - name: requirements.txt is the whole environment
      run: |
        pip check
        pip freeze > installed.txt
        python tests/requirements_lock.py requirements.txt installed.txt

    - name: Run tests with coverage
      run: |
        ./tests.sh

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov

  # The image, built as the server builds it.
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    steps:
    - uses: actions/checkout@v3

    # The TA engine's Pine runner, built into src/ as package.sh builds it for the server.
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: admin_ui/.nvmrc
        cache: npm
        cache-dependency-path: admin_ui/package-lock.json

    - name: Build the Pine runner
      working-directory: admin_ui
      run: npm ci && npm run build:runner && npm run build:checker

    - name: Build the image
      run: docker build -t wata-base:ci --platform=linux/amd64 --build-arg PYTHON_VERSION=${{ matrix.python-version }} .

    - name: It has the Python asked for, and the libraries of requirements.txt and no other
      run: |
        docker run --rm wata-base:ci python --version | grep -F "Python ${{ matrix.python-version }}."
        docker run --rm wata-base:ci python -m pip check
        docker run --rm wata-base:ci python -m pip freeze > installed.txt
        python3 tests/requirements_lock.py requirements.txt installed.txt

    # What the install checks of a release's image before naming it the newest (src/release/check.py):
    # every file compiles, every service loads, the libraries are requirements.txt's, the validators take the
    # configuration, the Pine runner runs confined.
    - name: Every service can be loaded in it
      run: |
        docker run --rm --network none -v "$PWD/tests/test_config.json:/app/etc/config.json:ro" wata-base:ci \
          python -m src.release.check

    # The fingerprints a deploy compares (src/release/manifest.py), read inside the image as the server
    # reads them: given on stdin to its Python, and what the entries load inside them.
    - name: What each container runs is fingerprinted inside the image
      run: |
        docker run --rm -i --network none --entrypoint python wata-base:ci - --root /app \
          < src/release/manifest.py > manifest.json
        python3 -c "import json; found = json.load(open('manifest.json')); assert len(found['containers']) == 11, found['containers'].keys(); assert all(entry['distributions'] for entry in found['containers'].values()); print({name: entry['code'] for name, entry in found['containers'].items()})"

    - name: The TA engine's Pine runner runs in it, confined
      run: |
        docker run --rm wata-base:ci node --version | grep -F "v$(cat admin_ui/.nvmrc)."
        docker run --rm wata-base:ci python -m src.ta_engine.runner

    # As the compose file starts a service (init: true): tini hands Docker's stop to Python, which the start
    # script exec'd. The scheduler then leaves its loop and says so; a shell left in between would have kept
    # the signal from it, and Docker killed it after the time allowed, its stopping code never run.
    - name: A service stops at once and cleanly on Docker's stop
      run: |
        # A whole configuration (the tests' has no day_trading rule, without which the scheduler stops at its
        # start), its logs in /tmp/logs, its database on a closed port: refused at once, it waits for its
        # credentials, which the stop must cut short.
        python3 -c "
        import json
        config = json.load(open('etc/config_example.json'))
        config['logging']['persistant']['log_path'] = '/tmp/logs'
        config['postgresql']['dsn'] = 'postgresql://wata:wata@127.0.0.1:9/wata'
        json.dump(config, open('stopping.json', 'w'))
        "
        docker run -d --init --network none --name stopping -e WATA_APP_ROLE=scheduler \
          -v "$PWD/stopping.json:/app/etc/config.json:ro" wata-base:ci
        sleep 5
        test "$(docker inspect -f '{{.State.Running}}' stopping)" = true
        started=$(date +%s)
        docker stop -t 30 stopping
        took=$(( $(date +%s) - started ))
        echo "Stopped in ${took}s"
        test "$took" -lt 5
        test "$(docker inspect -f '{{.State.ExitCode}}' stopping)" = 0
        docker cp stopping:/tmp/logs/wata-scheduler/wata-scheduler.log scheduler.log
        grep -F "WATA scheduler stopped" scheduler.log
        docker rm stopping

    # The control service on this runner's Docker, as the compose file starts it: it restarts a container
    # named and labelled as one of WATA's, which then reads the file bind-mounted into it alone even though
    # that file was replaced (as the config editor replaces config.json); it refuses what is not WATA's.
    - name: The control service restarts WATA's containers and nothing else
      run: |
        (umask 077 && openssl rand -hex 32 > control_token)
        cp tests/test_config.json watched.json
        docker run -d --init --name scheduler1 --label com.docker.compose.service=scheduler1 \
          -v "$PWD/watched.json:/app/etc/config.json:ro" wata-base:ci sleep 3600
        docker run -d --name trader1 alpine:3.20 sleep 3600
        docker run -d --init --name service_control1 -e WATA_APP_ROLE=service_control -p 127.0.0.1:8090:8090 \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$PWD/control_token:/run/secrets/service_control_token:ro" wata-base:ci
        for attempt in $(seq 30); do curl -sf http://127.0.0.1:8090/health && break; sleep 1; done
        auth="Authorization: Bearer $(cat control_token)"
        test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/services)" = 401
        curl -sf -H "$auth" http://127.0.0.1:8090/services | python3 -c "
        import json, sys
        found = {entry['service']: entry for entry in json.load(sys.stdin)['services']}
        assert found['scheduler']['running'] is True, found['scheduler']
        assert found['ta_engine']['state'] == 'absent', found['ta_engine']
        "
        python3 -c "
        import json, os
        config = json.load(open('watched.json'))
        config['marker'] = 'replaced'
        json.dump(config, open('watched.tmp', 'w'))
        os.replace('watched.tmp', 'watched.json')
        "
        docker exec scheduler1 grep -qF replaced /app/etc/config.json \
          && echo "Running, the container already reads the new file" \
          || echo "Running, the container still reads the file it started with"
        before=$(docker inspect -f '{{.State.StartedAt}}' scheduler1)
        test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$auth" http://127.0.0.1:8090/services/scheduler/restart)" = 202
        for attempt in $(seq 60); do
          test "$(docker inspect -f '{{.State.StartedAt}}' scheduler1)" != "$before" \
            && test "$(docker inspect -f '{{.State.Running}}' scheduler1)" = true && break
          sleep 1
        done
        test "$(docker inspect -f '{{.State.StartedAt}}' scheduler1)" != "$before"
        docker exec scheduler1 grep -qF replaced /app/etc/config.json
        for attempt in $(seq 30); do
          curl -sf -H "$auth" http://127.0.0.1:8090/services | python3 -c "
        import json, sys
        found = {entry['service']: entry for entry in json.load(sys.stdin)['services']}
        sys.exit(0 if not found['scheduler']['restarting'] and found['scheduler']['last_restart']['ok'] else 1)
        " && break
          sleep 1
        done
        # Not one of its services, or a container named like one of WATA's that is not of its compose file.
        curl -s -X POST -H "$auth" http://127.0.0.1:8090/services/postgres/restart | grep -F "not one of WATA's services"
        curl -s -X POST -H "$auth" http://127.0.0.1:8090/services/trader/restart | grep -F "not the container of WATA's compose file"
        docker logs service_control1
        docker rm -f scheduler1 trader1 service_control1

  # The image exactly as the server builds it: no Python asked for.
  image-as-deployed:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # wata-base:<VERSION> and wata-backup:<VERSION>, as the install builds them (docker_build.sh, the
    # checkout standing for a release's folder).
    - name: Build the images with the server's own script
      run: ./docker_build.sh

    - name: It has the Python the Dockerfile names
      run: |
        expected=$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)
        test -n "$expected"
        docker run --rm wata-base:$(cat VERSION) python --version | grep -F "Python $expected."

    # What a deploy by service rests on, seen on real Docker (src/release/host.py): containers pinned by a
    # second env file, a start that recreates nothing, one container recreated alone on another image, the
    # commands watadeploy runs read back, and a command run in a container of its own, out of Traefik's routes.
    - name: One container moves to another image, and the other is not touched
      run: |
        set -eux
        version=$(cat VERSION)
        docker tag "wata-base:$version" wata-base:toy-old
        printf 'FROM wata-base:%s\nLABEL toy=new\n' "$version" | docker build -t wata-base:toy-new -
        mkdir -p toy/1.0.0/deploy toy/release
        printf '%s\n' 'services:' \
          '  trader1:' '    image: ${WATA_IMAGE_TRADER1:-wata-base:latest}' '    init: true' '    command: ["sleep", "3600"]' \
          '  admin1:' '    image: ${WATA_IMAGE_ADMIN1:-wata-base:latest}' '    init: true' '    profiles: ["admin"]' \
          '    labels: ["traefik.enable=true"]' '    command: ["sleep", "3600"]' > toy/1.0.0/deploy/docker-compose.yml
        printf 'COMPOSE_PROJECT_NAME=toy\nCOMPOSE_PROFILES=admin\n' > toy/.env
        printf 'WATA_IMAGE_TRADER1=wata-base:toy-old\nWATA_IMAGE_ADMIN1=wata-base:toy-old\n' > toy/release/images.env
        compose() { (cd toy/1.0.0/deploy && docker compose --env-file ../../.env --env-file ../../release/images.env "$@"); }
        compose up -d --no-recreate
        trader=$(docker inspect -f '{{.Id}}' toy-trader1-1)
        sed -i 's/^WATA_IMAGE_ADMIN1=.*/WATA_IMAGE_ADMIN1=wata-base:toy-new/' toy/release/images.env
        # A start after a pin moved recreates nothing.
        compose up -d --no-recreate
        test "$(docker inspect -f '{{.Config.Image}}' toy-admin1-1)" = wata-base:toy-old
        # The one container asked for, on its new image; the other untouched.
        compose up -d --no-deps --force-recreate --pull never admin1
        test "$(docker inspect -f '{{.Config.Image}}' toy-admin1-1)" = wata-base:toy-new
        test "$(docker inspect -f '{{.Id}}' toy-trader1-1)" = "$trader"
        # What watadeploy reads, through its own code.
        PYTHONPATH=. python3 -c "
        from src.release.host import Docker, Layout
        docker = Docker(Layout(base='$PWD/toy'))
        found = docker.containers()
        assert set(found) == {'trader1', 'admin1'}, found
        assert found['admin1']['Config']['Image'] == 'wata-base:toy-new'
        assert set(docker.compose('1.0.0', ['config', '--services']).stdout.split()) == {'trader1', 'admin1'}
        print('read back:', sorted(found))
        "
        # A command of its own, on another image than its service's, never one of Traefik's servers.
        one=$(WATA_IMAGE_TRADER1=wata-base:toy-new compose run -d --no-deps --label traefik.enable=false trader1 sleep 30)
        test "$(docker inspect -f '{{index .Config.Labels "traefik.enable"}}' "$one")" = false
        test "$(docker inspect -f '{{.Config.Image}}' "$one")" = wata-base:toy-new
        docker rm -f "$one"
        test "$(docker inspect -f '{{.Id}}' toy-trader1-1)" = "$trader"
        compose down

    # deploy/pg_backup.sh as pg_backup1 runs it, a folder standing for the bucket and a key made for the test.
    - name: A dump goes off the server encrypted, and only the key kept elsewhere opens it
      run: |
        backup="wata-backup:$(cat VERSION)"
        docker network create backup-check
        docker run -d --name backup-db --network backup-check -e POSTGRES_USER=wata -e POSTGRES_PASSWORD=wata \
          -e POSTGRES_DB=wata postgres:16-alpine
        # Over TCP: the image's first start answers on its socket alone while it initialises, then restarts.
        for attempt in $(seq 1 30); do docker exec backup-db pg_isready -h 127.0.0.1 -U wata && break; sleep 1; done
        docker exec backup-db psql -U wata -d wata -c \
          "CREATE TABLE turbo_data_position (position_id text); INSERT INTO turbo_data_position VALUES ('p1')"
        mkdir -p check/backups check/bucket check/key
        # The key file is root's and its owner's alone, as age-keygen writes it: read in the image.
        docker run --rm -v "$PWD/check/key:/key" "$backup" age-keygen -o /key/identity.txt
        recipient=$(docker run --rm -v "$PWD/check/key:/key:ro" "$backup" age-keygen -y /key/identity.txt)
        test -n "$recipient"
        # The script the image carries (deploy/pg_backup.Dockerfile copies it in), as pg_backup1 runs it.
        docker run --rm --network backup-check --entrypoint sh \
          -v "$PWD/check/backups:/backups" -v "$PWD/check/bucket:/bucket" \
          -e PGHOST=backup-db -e PGUSER=wata -e PGPASSWORD=wata -e PGDATABASE=wata \
          -e BACKUP_AGE_RECIPIENT="$recipient" -e BACKUP_OFFSITE=offsite:/bucket/wata -e RCLONE_CONFIG_OFFSITE_TYPE=local \
          "$backup" /pg_backup.sh now
        cat check/backups/last.json
        grep -F '"offsite": {"ok": true' check/backups/last.json
        sealed=$(cd check/bucket && ls wata/nightly/*.age wata/weekly/*.age 2>/dev/null | head -n 1)
        test -n "$sealed"
        # Without the key it is no dump; with it, the dump of the table above.
        if docker run --rm -v "$PWD/check/bucket:/bucket:ro" "$backup" pg_restore --list "/bucket/$sealed"; then
          echo "The copy off the server reads without the key" >&2
          exit 1
        fi
        docker run --rm -v "$PWD/check/bucket:/bucket:ro" -v "$PWD/check/key:/key:ro" "$backup" sh -c \
          "age -d -i /key/identity.txt '/bucket/$sealed' > /tmp/restored.dump && pg_restore --list /tmp/restored.dump" \
          | grep -F "turbo_data_position"
        docker rm -f backup-db
        docker network rm backup-check

  # The database and the queue for real, with the libraries that talk to them.
  infrastructure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wata
          POSTGRES_PASSWORD: wata
          POSTGRES_DB: wata
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wata"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: wata
          RABBITMQ_DEFAULT_PASS: wata
        ports:
        - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary=:all: -r requirements.txt

    - name: PostgreSQL and RabbitMQ through the services' own code
      env:
        WATA_TEST_POSTGRES_DSN: postgresql://wata:wata@localhost:5432/wata
        WATA_TEST_RABBITMQ: wata:wata@localhost
        # A missing address fails here instead of skipping the tests.
        WATA_TEST_REQUIRE_LIVE: '1'
      run: |
        PYTHONPATH=./:src/ pytest -vv tests/test_infrastructure_live.py

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_ui

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: admin_ui/.nvmrc
        cache: npm
        cache-dependency-path: admin_ui/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Type-check
      run: npm run typecheck

    - name: Run tests
      run: npm test

    - name: Build
      run: npm run build
